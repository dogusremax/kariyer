<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Medyan Kadıköy Kapak</title>
<link rel="stylesheet" href="assets/pj.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000}
/* ?f=reel → 1080×1920, varsayılan → 1080×1440 (karusel 3:4) */
#c{position:relative;width:1080px;height:1440px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;color:#fff;
  background:linear-gradient(160deg,#910B19 0%,#DC1C2E 45%,#FB5160 100%);padding:0 76px;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.reel #c{height:1920px}
.big{position:absolute;left:40px;top:-60px;font-size:1150px;font-weight:800;line-height:1;color:rgba(255,255,255,.07);letter-spacing:-.06em}
.reel .big{top:180px}
.logo{position:absolute;right:76px;top:70px;width:230px}
.reel .logo{top:300px}
.tag{align-self:flex-start;background:#050A30;border-radius:20px;padding:16px 30px;font-weight:800;font-size:50px;letter-spacing:-.01em}
h1{font-size:118px;font-weight:800;line-height:1.02;letter-spacing:-.035em;margin-top:30px}
.sub{font-size:36px;font-weight:500;opacity:.92;margin-top:26px}
.list{margin-top:40px;display:flex;flex-direction:column;gap:14px}
.it{display:flex;align-items:center;gap:24px;padding:18px 24px;border-radius:22px;background:rgba(5,10,48,.22);border:2px solid rgba(255,255,255,.14);font-size:36px;font-weight:700}
.ic{flex:0 0 66px;height:66px;border-radius:16px;background:#050A30;display:flex;align-items:center;justify-content:center}
.ic svg{width:34px;height:34px}
.kay{margin-top:36px;font-size:28px;font-weight:800;letter-spacing:.32em;display:flex;align-items:center;gap:18px;opacity:.9}
.src{position:absolute;left:76px;right:76px;bottom:44px;font-size:21px;font-weight:600;opacity:.6}
.reel .src{bottom:290px}
</style>
</head>
<body>
<div id="c">
  <div class="big">4</div>
  <img class="logo" src="assets/dogus-logo.png" alt="RE/MAX Doğuş">
  <div class="tag">Medyan Kadıköy</div>
  <h1>Anahtar teslimi<br>başladı</h1>
  <div class="sub">Fikirtepe'nin dev projesinde son durum</div>
  <div class="list">
    <div class="it"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-3v16M9 21V3l6 3v15M15 21v-9l5 2v7M2 21h20"/></svg></div>4 blok · 1.080 konut · 12 ticari</div>
    <div class="it"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L20 3M16 7l3 3M14 9l2 2"/></svg></div>C ve D bloklarda anahtar teslimi</div>
    <div class="it"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>Oturum: Ekim – yıl sonu</div>
    <div class="it"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 12v4M12 18.5v.01"/></svg></div>İskân henüz yok, tapu kat irtifaklı</div>
    <div class="it"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 15.5h4"/></svg></div>A ve B: teslim tarihi açıklanmadı</div>
  </div>
  <div class="kay">İZLE <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="src">KAP · Vakıf GYO · ilan verileri · basın — Ekim 2026</div>
</div>
<script>if(location.search.includes('reel'))document.body.className='reel';</script>
</body>
</html>
